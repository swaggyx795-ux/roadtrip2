<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SF → NYC Road Trip (Car View + Live Weather)</title>
  <style>
    html,body{height:100%;margin:0;background:#05070b;color:#e8eef7;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    #wrap{position:fixed;inset:0}

    /* LAYERS (this is the important part) */
    #pano{position:absolute;inset:0;z-index:0}
    #windshieldMask{position:absolute;inset:0;z-index:1;pointer-events:none}
    #weatherCanvas{position:absolute;inset:0;z-index:2;pointer-events:none}
    #interior{position:absolute;inset:0;z-index:3;pointer-events:none}
    #hud{position:absolute;left:14px;top:14px;z-index:4;max-width:min(520px,92vw);
      background:rgba(10,16,24,.62);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px 12px}
    #hud .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
    #hud b{color:#fff}
    #hud p{margin:6px 0 0;font-size:12px;opacity:.9;line-height:1.25}

    #panel{position:absolute;left:14px;bottom:14px;z-index:4;width:min(560px,92vw);
      background:rgba(10,16,24,.62);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:12px;pointer-events:auto}
    #panel h2{margin:0 0 8px;font-size:14px}
    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input[type="text"]{flex:1;min-width:220px;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.06);color:#e8eef7;outline:none}
    button{padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
      background:rgba(125,211,252,.14);color:#e8eef7;cursor:pointer}
    button:hover{background:rgba(125,211,252,.22)}
    .pill{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12)}
    label{font-size:12px;opacity:.9}
    #log{margin-top:10px;max-height:170px;overflow:auto;border-radius:12px;background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);padding:8px}
    #log .item{font-size:12px;line-height:1.25;padding:6px 6px;border-bottom:1px solid rgba(255,255,255,.06)}
    #log .item:last-child{border-bottom:none}

    /* Windshield vignette (helps it feel like you're inside a car) */
    .vignette{
      position:absolute;inset:0;
      background:radial-gradient(1200px 650px at 50% 35%, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,.70) 100%);
    }
  </style>
</head>
<body>
<div id="wrap">
  <div id="pano"></div>

  <!-- windshield mask/vignette -->
  <div id="windshieldMask" class="vignette"></div>

  <!-- weather on windshield -->
  <canvas id="weatherCanvas"></canvas>

  <!-- “car interior” overlay -->
  <svg id="interior" viewBox="0 0 1000 600" preserveAspectRatio="none">
    <!-- A-pillars + dashboard silhouette -->
    <path d="M0,0 L150,0 L280,180 L280,600 L0,600 Z" fill="rgba(0,0,0,0.55)"/>
    <path d="M1000,0 L850,0 L720,180 L720,600 L1000,600 Z" fill="rgba(0,0,0,0.55)"/>
    <path d="M0,420 C220,360 780,360 1000,420 L1000,600 L0,600 Z" fill="rgba(0,0,0,0.70)"/>
    <!-- steering wheel ring -->
    <circle cx="500" cy="520" r="110" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="18"/>
    <circle cx="500" cy="520" r="72" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
  </svg>

  <div id="hud">
    <div class="row">
      <div class="pill"><b>Speed</b>: 50 mph</div>
      <div class="pill"><b>Progress</b>: <span id="progressPct">0.0%</span></div>
      <div class="pill"><b>Miles</b>: <span id="miles">0</span></div>
    </div>
    <p id="status">Paste your Google Maps API key, then click <b>Start</b>.</p>
    <p id="wxLine" style="margin:6px 0 0;font-size:12px;opacity:.9">Weather: <span id="wx">—</span></p>
  </div>

  <div id="panel">
    <h2>Controls</h2>
    <div class="controls">
      <input id="apiKey" type="text" placeholder="Google Maps API key (Maps JavaScript API enabled)"/>
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
      <span class="pill"><label><input id="offlineToggle" type="checkbox" checked style="vertical-align:middle;margin-right:6px">Continue while away</label></span>
    </div>

    <div class="controls" style="margin-top:10px">
      <span class="pill"><b>Now:</b> <span id="nowLoc">San Francisco, CA</span></span>
      <span class="pill"><b>Next:</b> <span id="nextLoc">—</span></span>
    </div>

    <div id="log"></div>
  </div>
</div>

<script>
(() => {
  // Waypoints (coarse)
  const WAYPOINTS = [
    {name:"San Francisco, CA", lat:37.7749, lng:-122.4194, state:"CA"},
    {name:"Oakland, CA", lat:37.8044, lng:-122.2711, state:"CA"},
    {name:"Sacramento, CA", lat:38.5816, lng:-121.4944, state:"CA"},
    {name:"Reno, NV", lat:39.5296, lng:-119.8138, state:"NV"},
    {name:"Salt Lake City, UT", lat:40.7608, lng:-111.8910, state:"UT"},
    {name:"Cheyenne, WY", lat:41.1400, lng:-104.8202, state:"WY"},
    {name:"Omaha, NE", lat:41.2565, lng:-95.9345, state:"NE"},
    {name:"Des Moines, IA", lat:41.5868, lng:-93.6250, state:"IA"},
    {name:"Chicago (near), IL", lat:41.8781, lng:-87.6298, state:"IL"},
    {name:"Cleveland, OH", lat:41.4993, lng:-81.6944, state:"OH"},
    {name:"NYC (metro), NY", lat:40.7128, lng:-74.0060, state:"NY"},
  ];

  const SPEED_MPH = 50;
  const SPEED_MPS = SPEED_MPH * 1609.344 / 3600;

  const $ = (id) => document.getElementById(id);
  const apiKeyEl = $("apiKey");
  const startBtn = $("startBtn");
  const pauseBtn = $("pauseBtn");
  const resetBtn = $("resetBtn");
  const offlineToggle = $("offlineToggle");
  const statusEl = $("status");
  const progressPctEl = $("progressPct");
  const milesEl = $("miles");
  const nowLocEl = $("nowLoc");
  const nextLocEl = $("nextLoc");
  const wxEl = $("wx");
  const logEl = $("log");

  // Weather overlay canvas
  const canvas = $("weatherCanvas");
  const ctx = canvas.getContext("2d");
  const particles = [];
  let wxMode = "none";
  let wxIntensity = 0;

  function resize() {
    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // Storage
  const STORE_KEY = "sv_trip_car_v1";
  const loadState = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch { return null; } };
  const saveState = () => localStorage.setItem(STORE_KEY, JSON.stringify(state));

  // Trip state
  let state = loadState() || {
    running:false, offlineContinue:true,
    wpIndex:0, t:0, meters:0,
    lastSeenAt: Date.now(),
    lastMilestoneIndex: 0,
    lastState: WAYPOINTS[0].state,
    apiKey:"",
    log:[]
  };

  apiKeyEl.value = state.apiKey || "";
  offlineToggle.checked = !!state.offlineContinue;

  // Segments
  function haversine(a, b) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat);
    const dLon = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const s = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }
  const segments = [];
  let totalMeters = 0;
  for (let i=0;i<WAYPOINTS.length-1;i++){
    const a=WAYPOINTS[i], b=WAYPOINTS[i+1];
    const m=haversine(a,b);
    segments.push({a,b,m});
    totalMeters += m;
  }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function posOnSeg(seg,t){ return {lat: lerp(seg.a.lat, seg.b.lat, t), lng: lerp(seg.a.lng, seg.b.lng, t)}; }

  function headingDeg(from, to){
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const φ1 = toRad(from.lat), φ2 = toRad(to.lat);
    const λ1 = toRad(from.lng), λ2 = toRad(to.lng);
    const y = Math.sin(λ2-λ1) * Math.cos(φ2);
    const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(λ2-λ1);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function miles(m){ return Math.round(m/1609.344); }
  function pct(){ return Math.min(100, (state.meters/totalMeters)*100); }

  function renderLog(){
    logEl.innerHTML = state.log.map(item => `<div class="item"><b>${item.ts}</b><br>${item.text}</div>`).join("") ||
      `<div class="item">Logbook empty… (yet)</div>`;
  }
  function pushLog(text){
    const ts = new Date().toLocaleString();
    state.log.unshift({ts, text});
    state.log = state.log.slice(0, 200);
    renderLog();
    saveState();
  }
  function setStatus(html){ statusEl.innerHTML = html; }

  // Google loader
  let googleReady = false;
  let pano = null;
  let svService = null;

  function loadGoogle(key){
    return new Promise((resolve, reject) => {
      if (googleReady) return resolve();
      if (!key) return reject(new Error("Missing API key."));
      window.gm_authFailure = () => reject(new Error("Google Maps auth failure (referrer/API)."));
      const s = document.createElement("script");
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&v=weekly`;
      s.async = true;
      s.onerror = () => reject(new Error("Failed to load Maps JS script."));
      s.onload = () => { googleReady = true; resolve(); };
      document.head.appendChild(s);
    });
  }

  async function ensureStreetView(){
    const key = apiKeyEl.value.trim();
    state.apiKey = key; saveState();
    await loadGoogle(key);

    if (!pano){
      // Disable most Google UI so it feels “in-car”
      pano = new google.maps.StreetViewPanorama(document.getElementById("pano"), {
        addressControl:false,
        linksControl:false,
        panControl:false,
        enableCloseButton:false,
        fullscreenControl:false,
        zoomControl:false,
        motionTracking:false,
        motionTrackingControl:false,
        showRoadLabels:false,
        clickToGo:true,
        disableDefaultUI:true,
      });
      svService = new google.maps.StreetViewService();
    }
  }

  // Weather (Open-Meteo)
  async function fetchWeather(lat,lng){
    const url = new URL("https://api.open-meteo.com/v1/forecast");
    url.searchParams.set("latitude", lat);
    url.searchParams.set("longitude", lng);
    url.searchParams.set("current", "temperature_2m,precipitation,rain,snowfall,weather_code");
    url.searchParams.set("timezone", "auto");
    const res = await fetch(url.toString());
    if(!res.ok) throw new Error("Weather fetch failed");
    return res.json();
  }
  function interpretWeather(current){
    const t = current?.temperature_2m;
    const precip = current?.precipitation ?? 0;
    const rain = current?.rain ?? 0;
    const snow = current?.snowfall ?? 0;
    let mode = "none";
    if (snow > 0) mode = "snow";
    else if (rain > 0 || precip > 0) mode = "rain";
    const intensity = Math.max(0, Math.min(1, precip / 4));
    return {t, precip, mode, intensity};
  }
  function spawnParticles(){
    const count = wxMode === "rain" ? Math.floor(160 + wxIntensity*320) :
                  wxMode === "snow" ? Math.floor(90 + wxIntensity*220) : 0;
    while (particles.length < count){
      particles.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        vx: wxMode==="rain" ? -50 : (-10 + Math.random()*20),
        vy: wxMode==="rain" ? (400 + Math.random()*260) : (60 + Math.random()*90),
        s: wxMode==="rain" ? (10 + Math.random()*18) : (2 + Math.random()*4),
        a: 0.35 + Math.random()*0.35
      });
    }
    while (particles.length > count) particles.pop();
  }
  function drawWeather(dt){
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    if (wxMode === "none" || wxIntensity <= 0.02) return;

    // subtle windshield haze
    const g = ctx.createLinearGradient(0,0,0,window.innerHeight);
    g.addColorStop(0, `rgba(255,255,255,${0.02*wxIntensity})`);
    g.addColorStop(1, `rgba(255,255,255,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

    ctx.save();
    if (wxMode === "rain"){
      ctx.strokeStyle = "rgba(200,230,255,0.7)";
      ctx.lineWidth = 1;
      for (const p of particles){
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.y > window.innerHeight+40 || p.x < -40){
          p.x = window.innerWidth + Math.random()*120;
          p.y = -Math.random()*200;
        }
        ctx.globalAlpha = p.a * (0.4 + 0.6*wxIntensity);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.s*0.35, p.y - p.s);
        ctx.stroke();
      }
    } else if (wxMode === "snow"){
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      for (const p of particles){
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.y > window.innerHeight+30){
          p.x = Math.random()*window.innerWidth;
          p.y = -Math.random()*120;
        }
        if (p.x < -30) p.x = window.innerWidth+30;
        if (p.x > window.innerWidth+30) p.x = -30;
        ctx.globalAlpha = p.a * (0.35 + 0.65*wxIntensity);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function waypointReached(i){
    if (i <= state.lastMilestoneIndex) return;
    const wp = WAYPOINTS[i];
    if (wp.state && wp.state !== state.lastState){
      pushLog(`Crossed into ${wp.state}.`);
      state.lastState = wp.state;
    }
    pushLog(`Passed ${wp.name}.`);
    state.lastMilestoneIndex = i;
    saveState();
  }

  function advance(dt){
    let remaining = dt * SPEED_MPS;
    while (remaining > 0 && state.wpIndex < segments.length){
      const seg = segments[state.wpIndex];
      const segRemaining = (1 - state.t) * seg.m;
      if (remaining >= segRemaining){
        remaining -= segRemaining;
        state.meters += segRemaining;
        state.wpIndex += 1;
        state.t = 0;
        waypointReached(Math.min(state.wpIndex, WAYPOINTS.length-1));
      } else {
        state.meters += remaining;
        state.t += remaining / seg.m;
        remaining = 0;
      }
    }
    if (state.wpIndex >= segments.length){
      state.running = false;
      pushLog("Arrived near NYC. Trip complete!");
      setStatus("Arrived near <b>NYC</b>. Trip complete! 🎉");
    }
    saveState();
  }

  function handleReturn(){
    const now = Date.now();
    const elapsed = Math.max(0, (now - (state.lastSeenAt || now)) / 1000);
    if (state.offlineContinue && state.running && elapsed > 3){
      const driven = miles(elapsed * SPEED_MPS);
      if (driven > 0){
        pushLog(`Welcome back — you drove ~${driven} miles while away.`);
        advance(elapsed);
      }
    }
    state.lastSeenAt = now;
    saveState();
  }

  let lastSVUpdate = 0;
  let lastWxUpdate = 0;

  async function updateScene(nowMs){
    progressPctEl.textContent = pct().toFixed(1) + "%";
    milesEl.textContent = miles(state.meters).toString();

    if (state.wpIndex >= segments.length) return;

    const seg = segments[state.wpIndex];
    const p = posOnSeg(seg, Math.max(0, Math.min(1, state.t)));
    nowLocEl.textContent = seg.a.name;
    nextLocEl.textContent = seg.b.name;

    if (nowMs - lastSVUpdate > 2500){
      lastSVUpdate = nowMs;
      try{
        await ensureStreetView();
        const lookAhead = posOnSeg(seg, Math.min(1, state.t + 0.02));
        const hdg = headingDeg(p, lookAhead);

        const panoData = await new Promise((resolve, reject) => {
          svService.getPanorama({ location: p, radius: 90, source: google.maps.StreetViewSource.OUTDOOR }, (data, status) => {
            if (status === "OK" && data) resolve(data);
            else reject(new Error("Coverage gap"));
          });
        });

        pano.setPano(panoData.location.pano);
        pano.setPov({ heading: hdg, pitch: 0 });
        setStatus(`Driving… <b>${miles(state.meters)}</b> mi / <b>${miles(totalMeters)}</b> mi`);
      } catch(e){
        setStatus(`<b>Street View gap:</b> ${e.message} — skipping…`);
        advance(20);
      }
    }

    if (nowMs - lastWxUpdate > 30000){
      lastWxUpdate = nowMs;
      try{
        const wx = await fetchWeather(p.lat, p.lng);
        const iw = interpretWeather(wx.current);
        wxEl.textContent = `${Math.round(iw.t)}°C • precip ${iw.precip} • ${iw.mode}`;
        const prev = wxMode;
        wxMode = iw.mode;
        wxIntensity = iw.intensity;
        spawnParticles();
        if (wxMode !== prev && wxMode !== "none"){
          pushLog(`Weather: ${wxMode} (intensity ${(wxIntensity*100).toFixed(0)}%).`);
        }
      } catch {
        wxEl.textContent = "Weather unavailable";
      }
    }
  }

  let lastFrame = performance.now();
  async function frame(now){
    const dt = Math.min(0.25, (now - lastFrame) / 1000);
    lastFrame = now;

    if (state.running) advance(dt);
    drawWeather(dt);
    await updateScene(now);

    requestAnimationFrame(frame);
  }

  startBtn.addEventListener("click", async () => {
    state.apiKey = apiKeyEl.value.trim();
    state.running = true;
    state.offlineContinue = offlineToggle.checked;
    saveState();
    try{
      await ensureStreetView();
      pushLog("Started trip.");
      setStatus("Starting…");
    } catch(e){
      setStatus(`<b>Error:</b> ${e.message}`);
    }
  });

  pauseBtn.addEventListener("click", () => {
    state.running = false;
    saveState();
    pushLog("Paused.");
    setStatus("Paused.");
  });

  resetBtn.addEventListener("click", () => {
    localStorage.removeItem(STORE_KEY);
    state = { running:false, offlineContinue:true, wpIndex:0, t:0, meters:0,
      lastSeenAt:Date.now(), lastMilestoneIndex:0, lastState:WAYPOINTS[0].state,
      apiKey: apiKeyEl.value.trim(), log:[] };
    wxMode="none"; wxIntensity=0; particles.length=0;
    renderLog();
    saveState();
    setStatus("Reset. Paste key and click Start.");
    wxEl.textContent = "—";
    nowLocEl.textContent = WAYPOINTS[0].name;
    nextLocEl.textContent = WAYPOINTS[1].name;
  });

  offlineToggle.addEventListener("change", () => {
    state.offlineContinue = offlineToggle.checked;
    saveState();
    pushLog(state.offlineContinue ? "Offline progress enabled." : "Offline progress disabled.");
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) handleReturn();
    state.lastSeenAt = Date.now();
    saveState();
  });

  window.addEventListener("beforeunload", () => {
    state.lastSeenAt = Date.now();
    saveState();
  });

  renderLog();
  handleReturn();
  setStatus("Paste your Google Maps API key, then click Start.");
  nowLocEl.textContent = WAYPOINTS[0].name;
  nextLocEl.textContent = WAYPOINTS[1].name;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
