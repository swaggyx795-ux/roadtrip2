<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SF → NYC Road Trip (Car View + Live Weather)</title>
  <!--
    IMPORTANT ABOUT BAKING IN YOUR GOOGLE API KEY

    If you put your key directly in this file and host it on GitHub Pages,
    your key is PUBLIC (anyone can view-source and copy it).

    If you still want it baked in (plug-and-play), do BOTH:
      1) Restrict the key to your site (HTTP referrers):
         https://YOUR_GITHUB_USER.github.io/*
      2) Restrict the key to ONLY the needed APIs (at minimum: Maps JavaScript API).

    Also: you pasted a key in chat earlier — assume it is compromised.
    Rotate the key in Google Cloud, then paste the NEW key below.
  -->
  <style>
    html,body{height:100%;margin:0;background:#0b0f14;color:#e9eef6;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    #app{position:relative;width:100%;height:100%}

    /* Street View fills the whole viewport */
    #pano{position:absolute;inset:0}

    /* Subtle vignette + windshield glass */
    #vignette{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse at center, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 65%, rgba(0,0,0,.85) 100%);
      z-index:3;
    }
    #glass{position:absolute;inset:0;pointer-events:none;z-index:4;
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,0) 40%, rgba(255,255,255,.03) 100%);
      mix-blend-mode:screen;
      opacity:.55;
    }

    /* Simple car interior overlay */
    #dash{position:absolute;left:0;right:0;bottom:0;height:34vh;min-height:240px;z-index:5;pointer-events:none}
    #dash .dash-bg{
      position:absolute;inset:0;
      background:
        radial-gradient(circle at 50% -40%, rgba(255,255,255,.12), rgba(255,255,255,0) 55%),
        linear-gradient(180deg, rgba(10,14,20,0) 0%, rgba(10,14,20,.55) 35%, rgba(6,8,12,.92) 100%);
    }
    #dash .steering{
      position:absolute;left:50%;transform:translateX(-50%);
      bottom:-14vh;width:34vh;height:34vh;border-radius:50%;
      border:10px solid rgba(255,255,255,.08);
      box-shadow:0 0 0 8px rgba(0,0,0,.35) inset, 0 18px 40px rgba(0,0,0,.55);
      background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.08), rgba(255,255,255,0) 55%);
      opacity:.8;
    }
    #dash .steering:before{
      content:"";position:absolute;inset:18%;border-radius:50%;
      border:8px solid rgba(255,255,255,.06);
    }

    /* HUD top-left */
    #hud{position:absolute;left:14px;top:14px;z-index:6;pointer-events:none}
    .pill{
      display:inline-block;margin:0 8px 8px 0;padding:8px 10px;border-radius:12px;
      background:rgba(15,20,30,.55);backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.08);
      font-size:13px;color:#dbe6ff
    }
    .pill b{font-weight:700;color:#fff}

    /* Controls panel bottom-left */
    #panel{
      position:absolute;left:14px;bottom:14px;z-index:7;
      width:min(420px, calc(100% - 28px));
      background:rgba(15,20,30,.55);backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.08);border-radius:14px;
      padding:12px;
    }
    #panel, #panel * {pointer-events:auto}
    #panel h2{margin:0 0 8px;font-size:14px}
    #row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input[type="text"]{
      flex:1;min-width:220px;padding:10px 10px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.25);color:#e9eef6;outline:none;
    }
    button{
      padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);color:#fff;cursor:pointer;
    }
    button:disabled{opacity:.45;cursor:not-allowed}
    label{font-size:12px;opacity:.9;display:flex;gap:8px;align-items:center}
    #log{margin-top:10px;max-height:120px;overflow:auto;font-size:12px;line-height:1.3;opacity:.95}
    #log .entry{padding:6px 0;border-top:1px solid rgba(255,255,255,.08)}
    #small{font-size:12px;opacity:.85;margin-top:8px}
    a{color:#8ab4ff}

    /* Non-blocking overlay for messages (click to dismiss) */
    #overlay{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.75);color:#fff;display:flex;
      align-items:center;justify-content:center;text-align:center;padding:24px}
    #overlay.hidden{display:none}

    /* Weather particles canvas */
    #fx{position:absolute;inset:0;z-index:8;pointer-events:none}

    /* Mini map top-right */
    #minimapWrap{
      position:absolute;right:14px;top:14px;z-index:7;
      width:min(420px, calc(100% - 28px));height:240px;
      background:rgba(15,20,30,.55);backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.08);border-radius:14px;
      overflow:hidden;
    }
    #minimap{width:100%;height:100%}
    #minimapWrap .label{position:absolute;left:10px;top:10px;z-index:2;
      font-size:12px;background:rgba(0,0,0,.35);padding:6px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
  </style>
</head>
<body>
<div id="app">
  <div id="pano"></div>
  <canvas id="fx"></canvas>

  <div id="vignette"></div>
  <div id="glass"></div>

  <div id="dash">
    <div class="dash-bg"></div>
    <div class="steering"></div>
  </div>

  <div id="hud">
    <div class="pill"><b>Speed</b>: <span id="speedTxt">50</span> mph</div>
    <div class="pill"><b>Progress</b>: <span id="progTxt">0.0%</span></div>
    <div class="pill"><b>Miles</b>: <span id="milesTxt">0</span></div>
    <div class="pill"><b>Weather</b>: <span id="wxTxt">—</span></div>
  </div>

  <div id="minimapWrap" aria-label="Mini map">
    <div class="label">Mini map (route)</div>
    <div id="minimap"></div>
  </div>

  <div id="panel">
    <h2>Controls</h2>
    <div id="row">
      <!-- Keep the input (handy for quick key swaps), but we auto-fill it from BAKED_API_KEY -->
      <input id="apiKey" type="text" placeholder="Google Maps API key (Maps JavaScript API enabled)"/>
      <button id="startBtn">Start</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="row" style="margin-top:10px">
      <label><input id="offlineChk" type="checkbox" checked/> Continue while away</label>
      <label><input id="rememberChk" type="checkbox"/> Remember key (local only)</label>
    </div>
    <div id="small">
      If your key fails, it’s almost always referrer restrictions. Allow:
      <b>https://YOURNAME.github.io/*</b> (and your repo path) in Google Cloud.
      Open DevTools → Console for exact Google error.
    </div>
    <div id="log"></div>
  </div>

  <div id="overlay" class="hidden">Click to dismiss</div>
</div>

<script>
(() => {
  // =============================
  // 1) CONFIG
  // =============================

  // ✅ Bake your key here for auto-load:
  const BAKED_API_KEY = "PASTE_KEY_HERE";

  // Start/end
  const SF = {lat: 37.7749, lng: -122.4194, name: "San Francisco, CA"};
  const NYC = {lat: 40.7128, lng: -74.0060, name: "New York City, NY"};

  // Simple route points (rough highway-ish polyline)
  const ROUTE = [
    {lat:37.7749,lng:-122.4194,name:"San Francisco, CA"},
    {lat:37.8044,lng:-122.2711,name:"Oakland, CA"},
    {lat:38.5816,lng:-121.4944,name:"Sacramento, CA"},
    {lat:39.5296,lng:-119.8138,name:"Reno, NV"},
    {lat:40.7608,lng:-111.8910,name:"Salt Lake City, UT"},
    {lat:39.7392,lng:-104.9903,name:"Denver, CO"},
    {lat:41.2565,lng:-95.9345,name:"Omaha, NE"},
    {lat:41.8781,lng:-87.6298,name:"Chicago, IL"},
    {lat:41.4993,lng:-81.6944,name:"Cleveland, OH"},
    {lat:40.4406,lng:-79.9959,name:"Pittsburgh, PA"},
    {lat:39.9526,lng:-75.1652,name:"Philadelphia, PA"},
    {lat:40.7128,lng:-74.0060,name:"New York City, NY"}
  ];

  // Detour route (optional, not fully used here yet)
  const DETOUR = [
    {lat:39.7392,lng:-104.9903,name:"Denver, CO"},
    {lat:39.7684,lng:-86.1581,name:"Indianapolis, IN"},
    {lat:38.9072,lng:-77.0369,name:"Washington, DC"},
    {lat:40.7128,lng:-74.0060,name:"New York City, NY"}
  ];

  // Simulation
  const MPH_DEFAULT = 50;
  const TICK_MS = 1000; // 1 second
  const OFFLINE_KEY = "roadtrip_offline_state_v1";
  const KEY_STORE = "roadtrip_api_key_v1";

  // Weather: Open-Meteo (no API key)
  // We'll fetch current weather from open-meteo for current position.
  // =============================
  // 2) STATE
  // =============================
  let googleReady = false;
  let pano = null;
  let map = null;
  let routeLine = null;
  let carMarker = null;

  const state = {
    apiKey: "",
    running: false,
    paused: false,
    speedMph: MPH_DEFAULT,
    miles: 0,
    segIndex: 0,
    segT: 0, // 0..1 along current segment
    lastTick: Date.now(),
    lastSavedAt: Date.now(),
    lastPos: {...ROUTE[0]},
    lastWxFetchAt: 0,
    wx: {label:"—", isRain:false, isSnow:false, wind:0, tempC:null},
    log: []
  };

  // =============================
  // 3) DOM
  // =============================
  const $ = (id)=>document.getElementById(id);
  const apiKeyEl = $("apiKey");
  const startBtn = $("startBtn");
  const pauseBtn = $("pauseBtn");
  const resetBtn = $("resetBtn");
  const offlineChk = $("offlineChk");
  const rememberChk = $("rememberChk");
  const speedTxt = $("speedTxt");
  const progTxt  = $("progTxt");
  const milesTxt = $("milesTxt");
  const wxTxt    = $("wxTxt");
  const logEl    = $("log");
  const overlay  = $("overlay");
  const fx = $("fx");
  const fxCtx = fx.getContext("2d");

  function showOverlay(msg){
    overlay.textContent = msg + " (click to dismiss)";
    overlay.classList.remove("hidden");
  }
  function hideOverlay(){
    overlay.classList.add("hidden");
  }
  overlay.addEventListener("click", hideOverlay);

  function log(msg){
    const ts = new Date().toLocaleString();
    state.log.unshift({ts,msg});
    state.log = state.log.slice(0, 40);
    renderLog();
  }
  function renderLog(){
    logEl.innerHTML = state.log.map(e => `<div class="entry"><b>${e.ts}</b><br>${escapeHtml(e.msg)}</div>`).join("");
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // =============================
  // 4) PERSISTENCE (offline travel)
  // =============================
  function saveState(){
    const payload = {
      t: Date.now(),
      miles: state.miles,
      segIndex: state.segIndex,
      segT: state.segT,
      lastPos: state.lastPos,
      running: state.running,
      paused: state.paused,
      speedMph: state.speedMph,
      log: state.log
    };
    localStorage.setItem(OFFLINE_KEY, JSON.stringify(payload));
    state.lastSavedAt = Date.now();
  }

  function loadState(){
    const raw = localStorage.getItem(OFFLINE_KEY);
    if(!raw) return false;
    try{
      const p = JSON.parse(raw);
      state.miles = p.miles ?? 0;
      state.segIndex = p.segIndex ?? 0;
      state.segT = p.segT ?? 0;
      state.lastPos = p.lastPos ?? {...ROUTE[0]};
      state.running = !!p.running;
      state.paused = !!p.paused;
      state.speedMph = p.speedMph ?? MPH_DEFAULT;
      state.log = Array.isArray(p.log)? p.log : [];
      return true;
    }catch(e){
      return false;
    }
  }

  function maybeApplyOfflineProgress(){
    if(!offlineChk.checked) return;
    const raw = localStorage.getItem(OFFLINE_KEY);
    if(!raw) return;
    try{
      const p = JSON.parse(raw);
      const then = p.t || Date.now();
      const now  = Date.now();
      const dtMs = Math.max(0, now - then);
      // Apply dt if running and not paused
      if(p.running && !p.paused){
        const hours = dtMs / 3600000;
        const milesAdd = (p.speedMph ?? MPH_DEFAULT) * hours;
        if(milesAdd > 0.01){
          state.miles = (p.miles ?? 0) + milesAdd;
          // We won't perfectly recompute segIndex/segT from miles; we'll just advance along route by stepping
          advanceByMiles(milesAdd, true);
          log(`Welcome back — you traveled ${milesAdd.toFixed(1)} miles while away.`);
        }
      }
    }catch(e){}
  }

  // =============================
  // 5) GEOMETRY / ROUTE ADVANCE
  // =============================
  function haversineMiles(a,b){
    const R = 3958.8;
    const toRad = d => d*Math.PI/180;
    const dLat = toRad(b.lat-a.lat);
    const dLng = toRad(b.lng-a.lng);
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function lerpPos(p,q,t){
    return {lat: lerp(p.lat,q.lat,t), lng: lerp(p.lng,q.lng,t)};
  }

  function routeTotalMiles(){
    let total=0;
    for(let i=0;i<ROUTE.length-1;i++) total += haversineMiles(ROUTE[i], ROUTE[i+1]);
    return total;
  }
  const TOTAL_MILES = routeTotalMiles();

  function advanceByMiles(miles, silent=false){
    let remaining = miles;
    while(remaining > 0.0001 && state.segIndex < ROUTE.length-1){
      const A = ROUTE[state.segIndex];
      const B = ROUTE[state.segIndex+1];
      const segMiles = haversineMiles(A,B);
      const segRemainingMiles = segMiles * (1 - state.segT);
      if(remaining >= segRemainingMiles){
        // finish segment
        state.segIndex++;
        state.segT = 0;
        remaining -= segRemainingMiles;
        state.lastPos = {...ROUTE[state.segIndex]};
        if(!silent) log(`Passed ${ROUTE[state.segIndex].name}`);
      }else{
        // partial
        const addT = remaining / segMiles;
        state.segT += addT;
        const pos = lerpPos(A,B,state.segT);
        state.lastPos = pos;
        remaining = 0;
      }
    }
  }

  function progressPct(){
    return Math.min(100, (state.miles / TOTAL_MILES) * 100);
  }

  // =============================
  // 6) GOOGLE MAPS LOADER
  // =============================
  function injectGoogle(apiKey){
    return new Promise((resolve, reject) => {
      if(window.google && window.google.maps){
        googleReady = true;
        resolve();
        return;
      }
      const s = document.createElement("script");
      // Use callback to know when loaded
      const cb = "__gm_cb_" + Math.random().toString(36).slice(2);
      window[cb] = () => { delete window[cb]; googleReady = true; resolve(); };
      s.onerror = () => reject(new Error("Failed to load Google Maps JS. Check key + referrer restrictions."));
      s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&callback=${cb}`;
      document.head.appendChild(s);
    });
  }

  function initPanoAndMap(){
    // Street View
    pano = new google.maps.StreetViewPanorama(document.getElementById("pano"),{
      position: state.lastPos,
      pov: {heading: 0, pitch: 0},
      zoom: 1,
      addressControl: false,
      showRoadLabels: false,
      fullscreenControl: true,
      linksControl: true,
      panControl: true,
      enableCloseButton: false
    });

    // Mini map
    map = new google.maps.Map(document.getElementById("minimap"),{
      center: SF,
      zoom: 4,
      disableDefaultUI: true,
      gestureHandling: "greedy",
      styles: [
        {elementType:"geometry",stylers:[{color:"#0b0f14"}]},
        {elementType:"labels.text.stroke",stylers:[{color:"#0b0f14"}]},
        {elementType:"labels.text.fill",stylers:[{color:"#8ab4ff"}]},
        {featureType:"road",elementType:"geometry",stylers:[{color:"#1d2a3a"}]},
        {featureType:"water",elementType:"geometry",stylers:[{color:"#071a2b"}]},
        {featureType:"poi",stylers:[{visibility:"off"}]},
      ]
    });

    routeLine = new google.maps.Polyline({
      path: ROUTE,
      geodesic: true,
      strokeColor: "#8ab4ff",
      strokeOpacity: 0.85,
      strokeWeight: 4
    });
    routeLine.setMap(map);

    carMarker = new google.maps.Marker({
      position: state.lastPos,
      map,
      title: "You",
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 6,
        fillColor: "#ffd166",
        fillOpacity: 1,
        strokeColor: "#000",
        strokeOpacity: 0.25,
        strokeWeight: 2
      }
    });

    // Fit route
    const bounds = new google.maps.LatLngBounds();
    ROUTE.forEach(p => bounds.extend(p));
    map.fitBounds(bounds);

    // Try to keep pano imagery found: if no pano nearby, hop forward slightly until we find one
    snapToNearestPano();
  }

  function snapToNearestPano(){
    const sv = new google.maps.StreetViewService();
    const pos = state.lastPos;
    sv.getPanorama({location: pos, radius: 2500}, (data, status) => {
      if(status === "OK" && data && data.location && data.location.latLng){
        pano.setPosition(data.location.latLng);
      }else{
        // no pano, hop forward a bit
        if(state.segIndex < ROUTE.length-1){
          advanceByMiles(5, true);
          log("Street View gap — skipping forward to find coverage…");
          updateScene();
          // retry soon
          setTimeout(snapToNearestPano, 500);
        }else{
          log("No Street View coverage near destination.");
        }
      }
    });
  }

  // =============================
  // 7) WEATHER (Open-Meteo)
  // =============================
  async function fetchWeather(){
    const now = Date.now();
    if(now - state.lastWxFetchAt < 30_000) return; // throttle
    state.lastWxFetchAt = now;

    const {lat,lng} = state.lastPos;
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,precipitation,rain,snowfall,weather_code,wind_speed_10m&timezone=auto`;
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error("Weather fetch failed");
      const j = await res.json();
      const c = j.current || {};
      const tempC = (typeof c.temperature_2m === "number") ? c.temperature_2m : null;
      const rain = (c.rain || 0) > 0 || (c.precipitation || 0) > 0;
      const snow = (c.snowfall || 0) > 0;
      const wind = (typeof c.wind_speed_10m === "number") ? c.wind_speed_10m : 0;
      const code = c.weather_code;
      const label = wxLabel(code, rain, snow);

      state.wx = {label, isRain: rain, isSnow: snow, wind, tempC};
      wxTxt.textContent = `${label}${tempC!=null?` • ${tempC.toFixed(1)}°C`:``}${wind?` • wind ${wind.toFixed(0)}`:''}`;
    }catch(e){
      // don't spam
    }
  }

  function wxLabel(code, rain, snow){
    // Quick mapping of common WMO codes
    if(snow) return "Snow";
    if(rain) return "Rain";
    if(code==null) return "Clear";
    if(code === 0) return "Clear";
    if(code === 1 || code === 2) return "Partly cloudy";
    if(code === 3) return "Overcast";
    if(code >= 45 && code <= 48) return "Fog";
    if(code >= 51 && code <= 67) return "Drizzle/Rain";
    if(code >= 71 && code <= 77) return "Snow";
    if(code >= 80 && code <= 82) return "Rain showers";
    if(code >= 95) return "Thunderstorm";
    return "Weather";
  }

  // =============================
  // 8) PARTICLES (rain/snow)
  // =============================
  const particles = [];
  function resizeFx(){
    fx.width = window.innerWidth;
    fx.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeFx);
  resizeFx();

  function spawnParticles(){
    if(!(state.wx.isRain || state.wx.isSnow)) return;
    const count = state.wx.isSnow ? 3 : 10;
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*fx.width,
        y: -20,
        vy: state.wx.isSnow ? (30+Math.random()*40) : (500+Math.random()*600),
        vx: state.wx.isSnow ? (-15+Math.random()*30) : (-40+Math.random()*80),
        r: state.wx.isSnow ? (1+Math.random()*2.2) : (1+Math.random()*1.3),
        t: 0
      });
    }
  }

  function drawParticles(dt){
    fxCtx.clearRect(0,0,fx.width,fx.height);
    if(!(state.wx.isRain || state.wx.isSnow)) return;
    fxCtx.save();
    fxCtx.globalAlpha = state.wx.isSnow ? 0.85 : 0.55;
    fxCtx.fillStyle = "#ffffff";
    fxCtx.strokeStyle = "#cfe7ff";
    fxCtx.lineWidth = 1;

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.t += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if(state.wx.isSnow){
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        fxCtx.fill();
      }else{
        fxCtx.beginPath();
        fxCtx.moveTo(p.x, p.y);
        fxCtx.lineTo(p.x - p.vx*0.02, p.y - p.vy*0.02);
        fxCtx.stroke();
      }

      if(p.y > fx.height + 50 || p.x < -50 || p.x > fx.width + 50){
        particles.splice(i,1);
      }
    }
    fxCtx.restore();
  }

  // =============================
  // 9) MAIN LOOP
  // =============================
  function updateUI(){
    speedTxt.textContent = state.speedMph.toFixed(0);
    progTxt.textContent = progressPct().toFixed(1) + "%";
    milesTxt.textContent = state.miles.toFixed(0);
  }

  function updateScene(){
    updateUI();
    if(googleReady && pano){
      pano.setPosition(state.lastPos);
      if(carMarker) carMarker.setPosition(state.lastPos);
    }
  }

  function tick(){
    const now = Date.now();
    const dt = (now - state.lastTick) / 1000;
    state.lastTick = now;

    if(state.running && !state.paused){
      const milesAdd = (state.speedMph / 3600) * (dt);
      state.miles += milesAdd;
      advanceByMiles(milesAdd, false);

      if(state.segIndex >= ROUTE.length-1){
        state.running = false;
        startBtn.disabled = false;
        pauseBtn.disabled = true;
        log("Arrived in New York City! 🎉");
      }else{
        // occasionally resnap pano to avoid gaps
        if(Math.random() < 0.08 && googleReady) snapToNearestPano();
      }

      updateScene();
      fetchWeather();
      if(now - state.lastSavedAt > 2000) saveState();
    }

    // particles
    spawnParticles();
    drawParticles(dt);

    requestAnimationFrame(tick);
  }

  // =============================
  // 10) CONTROLS
  // =============================
  async function start(){
    hideOverlay();
    const key = apiKeyEl.value.trim();
    if(!key){
      showOverlay("Missing API key. Paste your Google Maps API key, or set BAKED_API_KEY in the file.");
      return;
    }
    state.apiKey = key;

    if(rememberChk.checked){
      localStorage.setItem(KEY_STORE, key);
    }

    startBtn.disabled = true;
    resetBtn.disabled = false;
    pauseBtn.disabled = false;
    state.running = true;
    state.paused = false;
    state.lastTick = Date.now();
    log("Trip started. Drag Street View to look around while you drive.");

    try{
      await injectGoogle(key);
      initPanoAndMap();
      updateScene();
      fetchWeather();
    }catch(e){
      console.error(e);
      showOverlay("Google Maps failed to load. Check: API enabled + referrer restrictions + correct URL. Open DevTools Console.");
      startBtn.disabled = false;
      state.running = false;
    }
  }

  function pause(){
    state.paused = !state.paused;
    pauseBtn.textContent = state.paused ? "Resume" : "Pause";
    log(state.paused ? "Paused." : "Resumed.");
    saveState();
  }

  function reset(){
    // Clear progress but keep API key
    const keepKey = apiKeyEl.value.trim();
    localStorage.removeItem(OFFLINE_KEY);
    state.running = false;
    state.paused = false;
    state.speedMph = MPH_DEFAULT;
    state.miles = 0;
    state.segIndex = 0;
    state.segT = 0;
    state.lastPos = {...ROUTE[0]};
    state.log = [];
    pauseBtn.textContent = "Pause";
    updateScene();
    renderLog();
    if(pano) pano.setPosition(state.lastPos);
    if(carMarker) carMarker.setPosition(state.lastPos);
    apiKeyEl.value = keepKey;
    log("Reset trip.");
    startBtn.disabled = false;
    pauseBtn.disabled = true;
  }

  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", reset);

  // =============================
  // 11) BOOT
  // =============================
  // load saved key (optional)
  const savedKey = localStorage.getItem(KEY_STORE);
  if(savedKey){
    apiKeyEl.value = savedKey;
  }

  // bake in if present
  if (BAKED_API_KEY && BAKED_API_KEY !== "PASTE_KEY_HERE"){
    apiKeyEl.value = BAKED_API_KEY;
    state.apiKey = BAKED_API_KEY;
  }

  loadState();
  maybeApplyOfflineProgress();
  updateScene();
  renderLog();

  // Auto-start if baked key is present
  if (BAKED_API_KEY && BAKED_API_KEY !== "PASTE_KEY_HERE"){
    start();
  } else {
    showOverlay("Paste your Google Maps API key into BAKED_API_KEY (in the file), then reload.");
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
